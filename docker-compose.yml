# Para só ver a aplicação funcionando, um comando sobe tudo em http://localhost:8080:
#   docker compose --profile app up --build
# Para desenvolver, sem o perfil, sobem só o banco e a caixa de e-mails (veja o README).
# As portas ficam disponíveis apenas nesta máquina (127.0.0.1).
services:
  app:
    profiles: [app]
    build: .
    container_name: financetable-app
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-financetable}
      DB_USERNAME: ${DB_USERNAME:-financetable}
      DB_PASSWORD: ${DB_PASSWORD:-financetable}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:${APP_PORT:-8080}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      # A imagem Alpine traz o wget do BusyBox.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: financetable-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-financetable}
      POSTGRES_USER: ${DB_USERNAME:-financetable}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-financetable}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-financetable} -d ${DB_NAME:-financetable}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Caixa de e-mails de teste: nada é enviado de verdade.
  # Mensagens em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: financetable-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
