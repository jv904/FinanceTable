spring:
  application:
    name: financetable-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financetable}
    username: ${DB_USERNAME:financetable}
    password: ${DB_PASSWORD:financetable}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    jdbc:
      # As tabelas de sessão são criadas pelo Flyway (V2).
      initialize-schema: never
    timeout: 8h
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Em milissegundos. Sem isto, um SMTP travado prenderia a tarefa de envio para sempre.
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Uma falha no provedor de e-mail não pode marcar a aplicação inteira como fora do ar.
    mail:
      enabled: false

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:FinanceTable <nao-responda@financetable.local>}
  password-reset-validity: 30m
  limits:
    login-account: { max: 5, window: 15m }
    login-ip: { max: 30, window: 15m }
    password-change: { max: 5, window: 15m }
    password-reset-ip: { max: 10, window: 15m }
    register-ip: { max: 10, window: 1h }
    forgot-email: { max: 3, window: 1h }
    forgot-ip: { max: 10, window: 1h }
